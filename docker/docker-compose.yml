services:
    limitador:
        image: limitador:v1.0.1
        ports: 
            - "8080:8080"
        networks:
            - diseniandoando
        environment:
            - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
            - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
            - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
            - SPRING_DATASOURCE_DRIVER_CLASS_NAME=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}
            - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO}
            - SPRING_JPA_SHOW_SQL=${SPRING_JPA_SHOW_SQL}
            - JWT_SECRET=${JWT_SECRET}
            - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS}
            - JWT_REMEMBER_ME_EXPIRATION_MS=${JWT_REMEMBER_ME_EXPIRATION_MS}
            - SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE=${SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE}
            - GEOIP_DATABASE_CITY_PATH=${GEOIP_DATABASE_CITY_PATH}
            - GEOIP_DATABASE_COUNTRY_PATH=${GEOIP_DATABASE_COUNTRY_PATH}
            - GEOIP_DATABASE_ASN_PATH=${GEOIP_DATABASE_ASN_PATH}
            - GEOIP_DATABASE_CACHE_SIZE=${GEOIP_DATABASE_CACHE_SIZE}
networks:
    diseniandoando:
        external: true